# ============================================================
# ASG-Net Configuration
# Semantic Segmentation using RGB + Multispectral Image Fusion
# ============================================================

# --- Dataset ---
dataset:
  name: "potsdam"
  root: "data/potsdam"
  patch_size: 512
  stride: 256              # Overlap for patch extraction
  num_classes: 6
  class_names:
    - "Impervious Surface"   # Roads, Pathways, Parking
    - "Building"             # Buildings
    - "Low Vegetation"       # Lawns, Playground
    - "Tree"                 # Trees
    - "Car"                  # Vehicles
    - "Clutter"              # Water, Background
  class_colors:             # RGB colors for visualization
    - [255, 255, 255]        # White - Impervious
    - [0, 0, 255]            # Blue - Building
    - [0, 255, 255]          # Cyan - Low Vegetation
    - [0, 255, 0]            # Green - Tree
    - [255, 255, 0]          # Yellow - Car
    - [255, 0, 0]            # Red - Clutter
  class_weights: [1.0, 1.2, 1.0, 1.0, 2.5, 3.0]  # Inverse frequency weighting
  # Standard Potsdam train/val/test split
  train_ids:
    - "2_10" 
    - "2_11"
    - "2_12"
    - "3_10"
    - "3_11"
    - "3_12"
    - "4_10"
    - "4_11"
    - "4_12"
    - "5_10"
    - "5_11"
    - "5_12"
    - "6_7"
    - "6_8"
    - "6_9"
    - "6_10"
    - "6_11"
    - "6_12"
  val_ids:
    - "7_7"
    - "7_8"
    - "7_9"
    - "7_10"
    - "7_11"
    - "7_12"
  test_ids:
    - "2_13"
    - "2_14"
    - "3_13"
    - "3_14"
    - "4_13"
    - "4_14"
    - "5_13"
    - "5_14"
    - "6_13"
    - "6_14"
    - "7_13"

# --- Model ---
model:
  name: "asg_net"
  backbone: "mit_b2"                     # MiT-B2 encoder
  pretrained: true
  pretrained_model: "nvidia/segformer-b2-finetuned-ade-512-512"
  encoder_channels: [64, 128, 320, 512]  # MiT-B2 stage output channels
  decoder_channels: 256                  # Unified decoder channel dim
  num_classes: 6
  fusion:
    type: "asg"                          # asg | add | concat | none
    use_cm_frm: true                     # Cross-Modal Feature Rectification
    gate_reduction: 16                   # Channel reduction ratio for gating
  edge_decoder:
    enabled: true                        # Boundary-aware auxiliary branch
    channels: 64

# --- Augmentation ---
augmentation:
  random_horizontal_flip: true
  random_vertical_flip: true
  random_rotation: true
  rotation_degrees: [0, 90, 180, 270]
  random_scale: true
  scale_range: [0.5, 2.0]
  color_jitter:
    enabled: true
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.1
  normalize:
    rgb_mean: [0.485, 0.456, 0.406]      # ImageNet stats
    rgb_std: [0.229, 0.224, 0.225]
    nir_mean: [0.5]                       # Approximate NIR stats
    nir_std: [0.25]

# --- Training ---
training:
  epochs: 100
  batch_size: 4
  num_workers: 4
  optimizer:
    type: "adamw"
    lr: 6.0e-5
    weight_decay: 0.01
    betas: [0.9, 0.999]
  scheduler:
    type: "poly"
    power: 0.9
    min_lr: 1.0e-6
  loss:
    ce_weight: 1.0
    lovasz_weight: 0.75
    edge_weight: 0.5
    edge_decay_epoch: 50                 # Decay edge loss weight after this epoch
  gradient_clip: 1.0
  amp: true                              # Mixed precision training
  early_stopping:
    enabled: true
    patience: 15
    metric: "miou"

# --- Evaluation ---
evaluation:
  sliding_window: true
  window_size: 512
  stride: 256
  flip_tta: true                         # Test-time augmentation with flips

# --- Paths ---
paths:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  result_dir: "results"
  figure_dir: "paper/figures"

# --- Logging ---
logging:
  tensorboard: true
  print_freq: 50                         # Print every N iterations
  save_freq: 5                           # Save checkpoint every N epochs
